<!--
  WordPress-Safe Scroll-Scrub Frame Sequence Hero
  ================================================
  Tested and production-proven. Avoids all WordPress content filter pitfalls.

  USAGE:
  1. Replace CDN_BASE with your frame image directory URL
  2. Replace TOTAL_FRAME_COUNT with your frame count
  3. Replace FRAME_PREFIX and FRAME_EXT with your naming pattern
  4. Replace foreground content (logo, tagline, CTA)
  5. Push to WordPress via REST API
  6. Verify: curl page | extract script | node --check

  CRITICAL RULES FOR WORDPRESS:
  - NO && operators (WordPress converts to &#038;&#038;)
  - NO template literals (backticks)
  - Use var, not let/const
  - Use nested if() instead of && for compound conditions
  - Use string concatenation, not interpolation
-->

<!-- wp:html -->
<div id="ju-hero-wrapper" style="position:relative; width:100%; height:300vh; overflow:visible;">
  <div id="ju-hero-sticky" style="position:sticky; top:0; width:100%; height:100vh; overflow:hidden;">

    <!-- CANVAS: where frames render -->
    <canvas id="ju-scroll-canvas" style="position:absolute; inset:0; width:100%; height:100%; z-index:1; display:block; background:#111;"></canvas>

    <!-- OVERLAY: darkens as user scrolls -->
    <div id="ju-scroll-overlay" style="position:absolute; inset:0; z-index:2; pointer-events:none; background:rgba(0,0,0,0); transition:background 0.3s ease;"></div>

    <!-- FOREGROUND: logo, tagline, CTA (customize this) -->
    <div id="ju-foreground" style="position:absolute; inset:0; z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:2rem;">
      <img
        src="YOUR_LOGO_URL"
        alt="Site Logo"
        style="width:320px; max-width:80%; margin-bottom:1.5rem; filter:drop-shadow(0 4px 24px rgba(0,0,0,0.5));"
      />
      <p style="font-family:'Cormorant Garamond',Georgia,serif; font-size:clamp(1.2rem,2.5vw,1.8rem); font-style:italic; color:rgba(244,239,226,0.9); margin:0 0 2rem; max-width:600px; text-shadow:0 2px 12px rgba(0,0,0,0.6);">
        Your Tagline Here
      </p>
      <a href="#next-section" style="display:inline-block; padding:0.75rem 2rem; border:1px solid rgba(205,181,119,0.6); color:#CDB577; font-family:'Inter',sans-serif; font-size:0.75rem; letter-spacing:0.15em; text-transform:uppercase; text-decoration:none; transition:all 0.3s ease; border-radius:2px;">
        Call To Action
      </a>
      <!-- Scroll indicator -->
      <div style="position:absolute; bottom:2rem; left:50%; transform:translateX(-50%); opacity:0.6;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="rgba(244,239,226,0.7)" stroke-width="1.5">
          <path d="M12 5v14M19 12l-7 7-7-7"/>
        </svg>
      </div>
    </div>

    <!-- PRELOADER: shows while frames load -->
    <div id="ju-scroll-preloader" style="position:absolute; inset:0; z-index:100; display:flex; align-items:center; justify-content:center; background:#111; transition:opacity 0.8s ease, visibility 0.8s ease;">
      <div style="text-align:center; max-width:320px; width:90%;">
        <img
          src="YOUR_LOGO_URL"
          alt="Loading..."
          style="width:240px; max-width:80%; margin:0 auto 1.5rem; display:block; opacity:0.9;"
        />
        <div style="width:100%; height:2px; background:rgba(255,255,255,0.15); border-radius:1px; overflow:hidden; margin-bottom:0.75rem;">
          <div id="ju-preloader-bar-fill" style="height:100%; width:0%; background:#c9a84c; border-radius:1px; transition:width 0.2s ease;"></div>
        </div>
        <p style="font-family:'Inter',sans-serif; font-size:0.7rem; letter-spacing:0.15em; text-transform:uppercase; color:rgba(255,255,255,0.5); margin:0;">Loading...</p>
      </div>
    </div>

  </div>
</div>

<script>
(function () {
  'use strict';

  var initialized = false;

  function initScrollHero() {
    if (initialized) return;

    var canvas = document.getElementById('ju-scroll-canvas');
    var overlay = document.getElementById('ju-scroll-overlay');
    var preloader = document.getElementById('ju-scroll-preloader');
    var barFill = document.getElementById('ju-preloader-bar-fill');
    var foreground = document.getElementById('ju-foreground');
    var wrapper = document.getElementById('ju-hero-wrapper');

    if (!canvas || !overlay || !wrapper) return;

    /* CRITICAL: Check canvas has layout dimensions. If not, retry. */
    if (canvas.clientWidth === 0 || canvas.clientHeight === 0) {
      setTimeout(initScrollHero, 100);
      return;
    }

    initialized = true;

    var ctx = canvas.getContext('2d');

    /* ===== CONFIGURATION (edit these) ===== */
    var CDN_BASE = 'https://your-site.com/wp-content/uploads/2026/06/';
    var FRAME_PREFIX = 'frame-';
    var FRAME_EXT = '.jpg';
    var PAD_LENGTH = 3;
    var TOTAL_FRAME_COUNT = 86;

    /* Detect mobile */
    var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 768;

    function buildFrameUrls() {
      var urls = [];
      if (isMobile) {
        /* Mobile: every other frame for speed */
        for (var j = 1; j <= TOTAL_FRAME_COUNT; j += 2) {
          urls.push(CDN_BASE + FRAME_PREFIX + String(j).padStart(PAD_LENGTH, '0') + FRAME_EXT);
        }
      } else {
        for (var k = 1; k <= TOTAL_FRAME_COUNT; k++) {
          urls.push(CDN_BASE + FRAME_PREFIX + String(k).padStart(PAD_LENGTH, '0') + FRAME_EXT);
        }
      }
      return urls;
    }

    var FRAME_URLS = buildFrameUrls();
    var TOTAL_FRAMES = FRAME_URLS.length;
    var images = [];
    var loadedCount = 0;
    var ready = false;

    /* ===== CANVAS SIZING (cover mode, high-DPI) ===== */
    function resizeCanvas() {
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var w = canvas.clientWidth;
      var h = canvas.clientHeight;
      if (w === 0 || h === 0) return;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    /* ===== DRAW FRAME (background-size: cover logic) ===== */
    function drawFrame(img) {
      if (!img || !img.naturalWidth) return;
      var cw = canvas.clientWidth;
      var ch = canvas.clientHeight;
      var iw = img.naturalWidth;
      var ih = img.naturalHeight;
      var scale = Math.max(cw / iw, ch / ih);
      var sw = iw * scale;
      var sh = ih * scale;
      var sx = (cw - sw) / 2;
      var sy = (ch - sh) / 2;
      ctx.clearRect(0, 0, cw, ch);
      ctx.drawImage(img, sx, sy, sw, sh);
    }

    /* ===== PRELOAD ALL FRAMES ===== */
    function preloadFrames() {
      FRAME_URLS.forEach(function (url, idx) {
        var img = new Image();
        img.onload = function () {
          loadedCount++;
          if (barFill) {
            barFill.style.width = Math.round((loadedCount / TOTAL_FRAMES) * 100) + '%';
          }
          if (loadedCount >= TOTAL_FRAMES) {
            ready = true;
            if (preloader) {
              preloader.style.opacity = '0';
              preloader.style.visibility = 'hidden';
              preloader.style.pointerEvents = 'none';
            }
            resizeCanvas();
            drawFrame(images[0]);
          }
        };
        img.onerror = function () {
          loadedCount++;
          if (barFill) {
            barFill.style.width = Math.round((loadedCount / TOTAL_FRAMES) * 100) + '%';
          }
          if (loadedCount >= TOTAL_FRAMES) {
            ready = true;
            if (preloader) {
              preloader.style.opacity = '0';
              preloader.style.visibility = 'hidden';
              preloader.style.pointerEvents = 'none';
            }
            resizeCanvas();
            if (images[0]) drawFrame(images[0]);
          }
        };
        img.src = url;
        images[idx] = img;
      });
    }

    /* ===== SCROLL-DRIVEN FRAME SCRUB ===== */
    var currentFrame = 0;
    var targetFrame = 0;
    var animating = false;
    var lastDrawnFrame = -1;

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function getScrollProgress() {
      var rect = wrapper.getBoundingClientRect();
      var vh = window.innerHeight;
      var scrollRange = wrapper.offsetHeight - vh;
      if (scrollRange <= 0) return 0;
      var scrolled = -rect.top;
      var progress = scrolled / scrollRange;
      return Math.min(Math.max(progress, 0), 1);
    }

    function tick() {
      if (!ready) {
        animating = false;
        return;
      }

      var progress = getScrollProgress();
      targetFrame = Math.floor(progress * (TOTAL_FRAMES - 1));

      var lerpSpeed = isMobile ? 0.25 : 0.12;
      currentFrame = lerp(currentFrame, targetFrame, lerpSpeed);

      var frameIndex = Math.round(currentFrame);
      /* NOTE: nested if instead of && to avoid WordPress &#038; mangling */
      if (frameIndex !== lastDrawnFrame) {
        if (images[frameIndex]) {
          drawFrame(images[frameIndex]);
          lastDrawnFrame = frameIndex;
        }
      }

      /* Update overlay darkness */
      var overlayOpacity = Math.min(progress * 0.4, 0.35);
      overlay.style.background = 'rgba(0, 0, 0, ' + overlayOpacity.toFixed(3) + ')';

      /* Fade foreground content as user scrolls */
      if (foreground) {
        var fgOpacity = 1 - Math.min(progress * 3, 1);
        foreground.style.opacity = fgOpacity.toFixed(3);
        foreground.style.transform = 'translateY(' + (progress * -60) + 'px)';
      }

      if (Math.abs(currentFrame - targetFrame) > 0.05) {
        requestAnimationFrame(tick);
      } else {
        animating = false;
      }
    }

    function onScroll() {
      if (!animating) {
        animating = true;
        requestAnimationFrame(tick);
      }
    }

    /* ===== INIT ===== */
    resizeCanvas();
    preloadFrames();

    window.addEventListener('scroll', onScroll, { passive: true });

    window.addEventListener('resize', function () {
      resizeCanvas();
      if (ready) {
        var idx = Math.round(currentFrame);
        if (images[idx]) drawFrame(images[idx]);
      }
    });

    window.addEventListener('orientationchange', function () {
      setTimeout(function () {
        resizeCanvas();
        if (ready) {
          var idx = Math.round(currentFrame);
          if (images[idx]) drawFrame(images[idx]);
        }
      }, 300);
    });

    setTimeout(function () { onScroll(); }, 100);

    /* Reduced motion: show static first frame */
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      canvas.style.display = 'none';
      wrapper.style.backgroundImage = "url('" + FRAME_URLS[0] + "')";
      wrapper.style.backgroundSize = 'cover';
      wrapper.style.backgroundPosition = 'center';
    }
  }

  /* Multiple init strategies — WordPress themes load unpredictably */
  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    setTimeout(initScrollHero, 0);
  } else {
    document.addEventListener('DOMContentLoaded', initScrollHero);
  }
  window.addEventListener('load', initScrollHero);
  setTimeout(initScrollHero, 500);
  setTimeout(initScrollHero, 1500);

})();
</script>

<style>
  /* Break out of theme container to full viewport width */
  #ju-hero-wrapper {
    margin-left: calc(-50vw + 50%) !important;
    margin-right: calc(-50vw + 50%) !important;
    width: 100vw !important;
    max-width: 100vw !important;
    padding: 0 !important;
  }
  #ju-hero-sticky {
    top: 0 !important;
  }
  /* Mobile: shorter scroll range */
  @media (max-width: 767px) {
    #ju-hero-wrapper {
      height: 250vh !important;
    }
    #ju-foreground img {
      width: 240px !important;
    }
  }
  /* GPU acceleration */
  #ju-scroll-canvas {
    will-change: transform;
    -webkit-transform: translateZ(0);
    transform: translateZ(0);
  }
</style>
<!-- /wp:html -->
